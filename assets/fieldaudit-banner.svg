    <text x="932" y="128" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">Inspection #1048</text>
    <text x="932" y="143" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.5">Facility walkthrough</text>
    <rect x="932" y="153" width="92" height="21" rx="10.5" fill="#FEF3C7"/>
    <circle cx="943" cy="163.5" r="3" fill="#D97706"/>
    <text x="951" y="166.5" fill="#92400E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="700">PENDING SYNC</text>
    <g fill="none" stroke="#CBD5E1" stroke-width="1">
      <rect x="932" y="184" width="151" height="39" rx="8" fill="#FFFFFF"/>
      <rect x="932" y="230" width="151" height="39" rx="8" fill="#FFFFFF"/>
      <rect x="932" y="276" width="151" height="39" rx="8" fill="#FFFFFF"/>
    </g>
    <g stroke="#0D9488" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="941" y="196" width="10" height="10" rx="2"/>
