<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">FieldAudit — offline-first inspection workflows</title>
  <desc id="desc">A dark indigo technical banner with a phone displaying a field inspection checklist, a queued sync indicator, and a server status card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D1F"/>
      <stop offset=".52" stop-color="#151B3B"/>
      <stop offset="1" stop-color="#0B1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset=".55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A4A"/>
      <stop offset="1" stop-color="#10182D"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8292C5" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1400" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="380" rx="22" fill="url(#grid)"/>
  <ellipse cx="1030" cy="190" rx="430" ry="280" fill="url(#glow)"/>
  <path d="M0 314C240 276 420 378 680 328S1120 257 1400 310V380H0Z" fill="#0B1226" fill-opacity=".42"/>
  <path d="M0 314C240 276 420 378 680 328S1120 257 1400 310" fill="none" stroke="#5969A4" stroke-opacity=".22" stroke-width="1.5"/>

  <g transform="translate(72 62)">
    <rect x="0" y="0" width="42" height="42" rx="12" fill="#202B54" stroke="#7383E8" stroke-opacity=".65"/>
    <path d="M12 12h13l5 5v14H12Z" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="m16 20 3 3 6-7M16 27h9" fill="none" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="16" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">FIELD OPERATIONS · MOBILE</text>
    <text x="0" y="93" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8">FieldAudit</text>
    <text x="0" y="132" fill="#C7D2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650">Capture offline. Sync deliberately.</text>
    <text x="0" y="166" fill="#9AA9CE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Local inspection drafts · Retry-aware sync · Visible conflict states</text>
    <g transform="translate(0 207)">
      <rect width="125" height="32" rx="16" fill="#1B2949" stroke="#6476BD" stroke-opacity=".55"/>
      <circle cx="15" cy="16" r="4" fill="#FBBF24"/>
      <text x="27" y="20.5" fill="#DCE6FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">PROTOTYPE</text>
      <rect x="136" width="151" height="32" rx="16" fill="#10343B" stroke="#2DD4BF" stroke-opacity=".5"/>
      <path d="M151 12h10v9h-10zM153 9h6" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="168" y="20.5" fill="#CCFBF1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">ANDROID + API</text>
    </g>
