    <rect x="1161" y="190" width="177" height="53" rx="13" fill="#102C32" stroke="#2DD4BF" stroke-opacity=".55"/>
    <circle cx="1181" cy="216" r="8" fill="#134E4A"/>
    <path d="M1177 216a4 4 0 0 1 7-3l2 3m-1-4v4h-4" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1197" y="211" fill="#99F6E4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".8">WORK QUEUE</text>
