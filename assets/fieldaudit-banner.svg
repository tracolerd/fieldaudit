    <text x="1220" y="112" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.2">API</text>
    <text x="1220" y="129" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Sync endpoint</text>
    <text x="1220" y="144" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Prototype storage</text>
