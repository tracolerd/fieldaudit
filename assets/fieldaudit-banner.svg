    <text x="959" y="199" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.5" font-weight="700">Safety equipment</text>
    <text x="959" y="210" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5">Visual check saved</text>
    <rect x="941" y="242" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="959" y="245" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.5" font-weight="700">Exit signage</text>
    <text x="959" y="256" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5">Awaiting review</text>
    <rect x="941" y="288" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="959" y="291" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.5" font-weight="700">Equipment log</text>
    <text x="959" y="302" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="7.5">Local draft</text>
  </g>

  <g filter="url(#softShadow)">
